<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>联系 · lambertlab</title>
  <meta name="description" content="LambertLab 联系方式" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" />
  <link rel="stylesheet" href="../css/shared-header.css" />
  <link rel="stylesheet" href="../css/bento-pages.css" />
  <style>
    .wrap {
      padding-top: 128px;
    }

    @media (max-width: 720px) {
      .wrap {
        padding-top: 128px;
      }
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#main-content">跳到主要内容</a>
  <header class="ll-header">
    <nav class="ll-header-inner">
      <a class="ll-brand" href="../index.html">
        <span class="ll-brand-mark">L</span>
        <span class="ll-brand-text">lambertlab</span>
      </a>
      <div class="ll-nav">
        <a class="ll-nav-link" href="../projects/index.html">Projects</a>
        <a class="ll-nav-link" href="../insights/index.html">Journal</a>
        <a class="ll-nav-link" href="../about/index.html">About</a>
        <a class="ll-cta" href="../contact/index.html">Get in touch</a>
        <div
          class="system-health-nav"
          data-system-status
          data-status-state="loading"
          role="status"
          tabindex="0"
          aria-live="polite"
          aria-label="系统状态检查中：正在连接后端服务，请稍候..."
          title="系统状态检查中：正在连接后端服务，请稍候..."
        >
          <span class="traffic-signal" aria-hidden="true">
            <span class="traffic-lamp" data-light="red"></span>
            <span class="traffic-lamp" data-light="yellow"></span>
            <span class="traffic-lamp" data-light="green"></span>
          </span>
          <span class="ll-sr-only" data-system-status-title>系统状态检查中</span>
          <span class="ll-sr-only" data-system-status-description>正在连接后端服务，请稍候...</span>
        </div>
      </div>
    </nav>
  </header>
  <div class="wrap">
    <main id="main-content">
      <section class="hero">
        <p class="kicker">Contact</p>
        <h1>欢迎交流</h1>
        <p>如果你正在建设数据基础设施、产品化 AI 工具，或以协作为核心的工程流程，欢迎附上背景信息发来简短消息。</p>
      </section>

      <section class="grid" aria-label="联系渠道">
        <article class="card span-2">
          <p class="mini">Primary</p>
          <h3>GitHub</h3>
          <p>查看项目、仓库和最近更新。</p>
          <div class="actions">
            <a class="btn primary" href="https://github.com/lambertlab" target="_blank" rel="noreferrer">打开 GitHub</a>
          </div>
        </article>

        <article class="card span-2">
          <p class="mini">Email</p>
          <h3>邮箱</h3>
          <p>适合项目合作、技术咨询和长期协作沟通。</p>
          <div class="actions">
            <a class="btn primary" href="mailto:you@example.com">发送邮件</a>
          </div>
        </article>

        <article class="card span-2">
          <p class="mini">Back</p>
          <h3>返回首页</h3>
          <p>继续浏览首页中的项目与洞察。</p>
          <div class="actions">
            <a class="btn" href="../index.html">回到首页</a>
          </div>
        </article>
      </section>
    </main>
  </div>
  <script src="../js/config.js"></script>
  <script src="../js/main.js"></script>
</body>
</html>
